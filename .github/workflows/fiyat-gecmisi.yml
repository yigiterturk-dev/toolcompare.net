name: Price history snapshot

on:
  push:
    paths:
      - src/data/tools.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toolcompare-price-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot plan prices
        run: npm run fiyat:gecmis

      - name: Commit the snapshot when prices changed
        run: |
          if git diff --quiet -- src/data/fiyat-gecmisi.json; then
            echo "No price changes to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/fiyat-gecmisi.json
          git commit -m "chore: record price history snapshot"
          git push
