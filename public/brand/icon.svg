<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ToolCompare">
  <!--
    ToolCompare markasi: iki pay cubugu = karsilastirma. Onceki cizim uc
    izometrik katman + degradeler + baglanti noktalariydi; 16-28 pikselde
    lapa oluyordu. Tek renk zemin, iki kalin pill, tek vurgu rengi: her
    olcude ayni siluet, ayrica 16 piksel icin ayri varyata gerek yok.
  -->
  <rect width="100" height="100" rx="22" fill="#0F172A"/>
  <rect x="24" y="50" width="20" height="30" rx="10" fill="#64748B"/>
  <rect x="56" y="26" width="20" height="54" rx="10" fill="#22D3EE"/>
</svg>
