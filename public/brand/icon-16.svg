<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ToolCompare">
  <!--
    16-24 piksel icin SADELESTIRILMIS varyant. Tam cizimde baglanti noktalari
    ve katman aralari bu boyutta lapa oluyordu (olculdu). Burada baglanti YOK,
    katmanlar buyuk ve aralari acik: 16 pikselde bile "ust uste uc katman"
    silueti okunuyor. ICO cok boyut tasidigi icin her boy kendi ciziminden
    uretiliyor.
  -->
  <defs>
    <linearGradient id="u" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="#111827"/>
  <path d="M50 60 L92 78 L50 96 L8 78 Z" fill="url(#a)"/>
  <path d="M50 35 L92 53 L50 71 L8 53 Z" fill="url(#o)" stroke="#111827" stroke-width="6"/>
  <path d="M50 10 L92 28 L50 46 L8 28 Z" fill="url(#u)" stroke="#111827" stroke-width="6"/>
</svg>
