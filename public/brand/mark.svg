<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ToolCompare">
  <!--
    ToolCompare markasi: uc izometrik katman (karsilastirilan seyler) ve
    ortadaki baglanti (karsilastirma). Kaynak logo 1024x1024 JPEG'di ve
    basliktaki 28 pikselik yer icin 651 KB indiriliyordu; bu SVG ayni marka,
    ~1 KB, her olcude keskin.
  -->
  <defs>
    <linearGradient id="tcUst" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="tcOrta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="tcAlt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <!-- Alttan uste ciziliyor ki ust katman ustte kalsin. -->
  <path d="M50 55 L84 72 L50 89 L16 72 Z" fill="url(#tcAlt)"/>
  <path d="M50 38 L84 55 L50 72 L16 55 Z" fill="url(#tcOrta)"/>
  <path d="M50 21 L84 38 L50 55 L16 38 Z" fill="url(#tcUst)"/>
  <!-- Baglanti: iki nokta + kiris. 16 pikselde kaybolmasin diye kalin. -->
  <g stroke="#0f172a" stroke-width="5" stroke-linecap="round">
    <path d="M38 42 L62 34"/>
  </g>
  <circle cx="38" cy="42" r="6" fill="#0f172a"/>
  <circle cx="62" cy="34" r="6" fill="#0f172a"/>
  <circle cx="38" cy="42" r="3" fill="#22d3ee"/>
  <circle cx="62" cy="34" r="3" fill="#22d3ee"/>
</svg>
